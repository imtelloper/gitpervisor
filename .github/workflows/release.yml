name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.0.0-dev"

jobs:
  build-tauri:
    permissions:
      contents: write
    # Windows Authenticode 서명용 (Azure Artifact Signing, 구 Trusted Signing).
    # 시크릿이 비어 있으면 서명 없이 빌드한다(기존과 동일). 설정법: DOCS/windows-code-signing.md
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
      AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
      AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
      # macOS 코드서명용 자체 서명 인증서(p12 base64 + 암호). 비어 있으면 서명 없이 빌드한다.
      # 설정법·이유: DOCS/macos-code-signing.md
      MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # OS별 안정 번들 포맷만 선택 (msi=WiX·dmg는 CI에서 불안정)
          #
          # macOS는 `app`을 반드시 함께 지정해야 한다. Tauri 업데이터는 macOS에서 `.dmg`가
          # 아니라 **`.app.tar.gz`** 를 내려받아 교체하므로, dmg만 만들면 서명(.sig)과
          # latest.json의 darwin 항목이 통째로 생성되지 않는다 — v0.3.4까지 실제로 그랬고
          # (에셋 16개 중 dmg만 .sig 없음, latest.json 플랫폼 10개에 darwin 0개),
          # 그래서 **macOS 사용자만 앱 내 자동 업데이트를 받지 못했다.**
          # dmg는 신규 설치용, app(.tar.gz)은 자동 업데이트용으로 둘 다 필요하다.
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app dmg --verbose"
          - platform: ubuntu-22.04
            args: "--bundles deb rpm appimage"
          # 라즈베리파이·Ampere 등 arm64 리눅스용. GitHub의 네이티브 ARM64 러너라
          # 크로스컴파일 설정이 필요 없다(퍼블릭 리포는 무료). webkit2gtk를 링크하는
          # 앱이라 x86 머신에서의 크로스빌드는 multiarch sysroot 지옥 → 네이티브가 정답.
          - platform: ubuntu-22.04-arm
            args: "--bundles deb rpm appimage"
          - platform: windows-latest
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # tauri-action reads GITHUB_TOKEN from env (below), not git creds,
          # so keep the contents:write token out of .git/config for later steps.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: "./src-tauri -> target"
          # x86/arm 러너 모두 runner.os가 "Linux"라 캐시 키가 겹칠 수 있다 → 러너 라벨로 분리.
          key: ${{ matrix.platform }}

      - name: Install Ubuntu system dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - name: Install frontend dependencies
        run: npm ci

      # 번들 ConPTY — Windows 10 내장 ConPTY의 TUI 스크롤 문제 회피(태스크 33).
      # nupkg 해시를 스크립트가 고정 대조하므로 변조 시 여기서 빌드가 멈춘다(의도한 동작).
      # Windows 잡에서만 받는다 — 다른 호스트에는 없어도 리소스 글롭이 비어 무해하다.
      # 인자 없이 부르면 ruff(31MB)+biome(77MB)까지 받으므로 `-- conpty`로 한정한다.
      - name: Fetch bundled ConPTY (Windows)
        if: matrix.platform == 'windows-latest'
        run: npm run fetch-tools -- conpty

      # Windows Authenticode 서명 준비 — 무서명 exe는 AhnLab V3 '앱 격리 검사'와 SmartScreen에
      # 걸려 설치가 막힌다(v0.3.5 실사례). 반드시 번들링 "중"에 signCommand로 서명해야 한다:
      # Tauri가 앱 exe → NSIS 설치본 순서로 서명한 뒤 업데이터 .sig를 최종 파일 기준으로 만든다.
      # 릴리스 에셋을 사후 서명하면 파일이 바뀌어 .sig 검증이 통째로 깨진다(자동 업데이트 불능).
      - name: Prepare Windows code signing
        if: matrix.platform == 'windows-latest' && env.AZURE_SIGN_ACCOUNT != ''
        shell: bash
        run: |
          cargo install artifact-signing-cli --locked
          cat > src-tauri/sign.windows.json <<EOF
          {
            "bundle": {
              "windows": {
                "signCommand": {
                  "cmd": "artifact-signing-cli",
                  "args": ["-e", "$AZURE_SIGN_ENDPOINT", "-a", "$AZURE_SIGN_ACCOUNT", "-c", "$AZURE_SIGN_PROFILE", "-d", "Gitpervisor", "%1"]
                }
              }
            }
          }
          EOF
          echo "TAURI_SIGN_ARGS=--config src-tauri/sign.windows.json" >> "$GITHUB_ENV"

      # macOS 코드서명 준비 — 서명이 없으면 macOS가 "Downloads 폴더 접근" 같은 개인정보 권한의
      # 허용을 앱에 묶어 저장하지 못해 **매번 다시 묻는다**(2026-10 실사례). 허용은 앱의 서명 신원
      # (designated requirement)에 묶이므로, 매 릴리스를 **같은 인증서**로 서명해야 한 번 허용이
      # 업데이트 뒤에도 유지된다. Apple 발급 인증서가 아니라 자체 서명이라 공증·Gatekeeper 경고는
      # 그대로다 — 그건 Developer ID의 일이다.
      #
      # `APPLE_CERTIFICATE` 경로는 쓸 수 없다: Tauri가 그 인증서를 Apple 발급 이름
      # ("Developer ID Application:" 등)으로만 찾는다. 그래서 여기서 키체인에 넣고 신원(SHA-1)만
      # `APPLE_SIGNING_IDENTITY`로 넘긴다 — Tauri는 그러면 keychain 인자 없이 codesign을 부르므로
      # **검색 목록에 더해야** 한다(없으면 `--keychain`을 줘도 "no identity found").
      #
      # 신뢰 등록은 하지 않는다 — 필요 없고, 러너에선 할 수도 없다. 신뢰 안 된 자체 서명
      # (`CSSMERR_TP_NOT_TRUSTED`, `find-identity -v` 0개)도 SHA-1로 지정하면 codesign이 서명·검증까지
      # 통과한다(2026-10-05 로컬 실측). 반대로 신뢰 설정 변경은 root여도 화면 승인을 요구해, v0.12.5
      # 첫 시도에서 `sudo security authorizationdb write …`가 `NO (-60005)`로 막혀 잡이 죽었다.
      - name: Prepare macOS code signing (self-signed)
        if: matrix.platform == 'macos-latest' && env.MACOS_SIGNING_P12 != ''
        run: |
          set -euo pipefail
          # 작업 로그는 저장소 관리자 인증이 있어야 내려받힌다 — 실패한 명령을 공개 주석으로도 남긴다.
          trap 'echo "::error title=macOS code signing::exit $? at line $LINENO: $BASH_COMMAND"' ERR
          # 이 인증서로만 서명한다. 신원이 바뀌면 모든 사용자의 권한 허용이 한 번씩 풀린다
          # (DOCS/macos-code-signing.md) — 시크릿이 다른 인증서로 바뀌었으면 여기서 멈춘다.
          EXPECTED_SHA1="B2BE003E2A21D26B51935ED8B661E93DB34DFE6C"
          KC="$RUNNER_TEMP/gpv-signing.keychain-db"
          KC_PASS="$(openssl rand -hex 16)"
          P12="$RUNNER_TEMP/gpv-signing.p12"
          echo "$MACOS_SIGNING_P12" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$P12" -k "$KC" -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          # 기존 검색 목록은 한 줄에 경로 하나(따옴표 포함)다. 경로에 공백이 있을 수 있어 단어로 쪼개면
          # 목록이 깨진다(로컬 실측: "iOS Developer: … .keychain"). bash 3.2에도 있는 read 루프로 담는다.
          KEYCHAINS=("$KC")
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"; line="${line#\"}"; line="${line%\"}"
            if [ -n "$line" ]; then KEYCHAINS+=("$line"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${KEYCHAINS[@]}"
          # `find-identity -v`는 신뢰된 신원만 보여 여기선 늘 비므로 인증서 자체의 SHA-1을 읽는다.
          HASH="$(security find-certificate -c "Gitpervisor Code Signing" -Z "$KC" | awk '/SHA-1 hash:/ {print $3; exit}')"
          if [ "$HASH" != "$EXPECTED_SHA1" ]; then
            echo "::error title=macOS code signing::signing certificate SHA-1 is '$HASH', expected $EXPECTED_SHA1"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$HASH" >> "$GITHUB_ENV"

      - name: Build & release Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Monaco 번들링이 기본 Node 힙(~2GB)을 넘겨 OOM → 힙 상향
          NODE_OPTIONS: --max-old-space-size=4096
          # 자동 업데이트 서명 — 이 키가 있으면 tauri-action이 각 설치본을 서명(.sig)하고
          # latest.json 업데이트 매니페스트를 생성해 릴리스에 업로드한다. 키/비번은 repo Secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: "Gitpervisor ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          releaseBody: "See the assets below to download and install."
          # 자동 공개: draft면 /releases/latest API가 404 → 웹사이트 다운로드 버튼이
          # 릴리스 목록 페이지로 폴백된다. 태그 푸시만으로 설치 파일이 링크되도록 공개.
          releaseDraft: false
          # 수동 실행(workflow_dispatch)은 리허설용이므로 prerelease로 표시한다.
          # /releases/latest API가 prerelease를 건너뛰어, 테스트 태그가 웹사이트
          # 다운로드 버튼이나 앱 자동 업데이트를 가로채지 않는다.
          # 태그 푸시(진짜 릴리스)는 false → 정식 공개.
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          # TAURI_SIGN_ARGS: Windows 서명 스텝이 시크릿 존재 시에만 --config 주입(없으면 빈 값)
          args: ${{ matrix.args }} ${{ env.TAURI_SIGN_ARGS }}

      # 릴리스는 위 단계에서 이미 공개됐다 — 여기서 빨개지는 것은 "서명이 빠진 채 나갔다"는 경보다.
      # 신원이 바뀌면 모든 사용자의 권한 허용이 한 번씩 풀리므로, 인증서 SHA-1까지 맞는지 본다.
      # 자체 서명은 leaf가 곧 root라 codesign이 `certificate root = H"…"`로 적는다(로컬 실측) — 둘 다 받는다.
      - name: Verify macOS code signature
        if: matrix.platform == 'macos-latest' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Gitpervisor.app"
          codesign --verify --strict --deep "$APP"
          REQ="$(codesign -d -r- "$APP" 2>&1)"
          echo "$REQ"
          echo "$REQ" | grep -q 'identifier "com.greathoon.gitpervisor"'
          echo "$REQ" | grep -qiE "certificate (leaf|root) = H\"$APPLE_SIGNING_IDENTITY\""

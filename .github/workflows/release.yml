name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.0.0-dev"

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # OS별 안정 번들 포맷만 선택 (msi=WiX·dmg는 CI에서 불안정)
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles dmg --verbose"
          - platform: ubuntu-22.04
            args: "--bundles deb rpm appimage"
          # 라즈베리파이·Ampere 등 arm64 리눅스용. GitHub의 네이티브 ARM64 러너라
          # 크로스컴파일 설정이 필요 없다(퍼블릭 리포는 무료). webkit2gtk를 링크하는
          # 앱이라 x86 머신에서의 크로스빌드는 multiarch sysroot 지옥 → 네이티브가 정답.
          - platform: ubuntu-22.04-arm
            args: "--bundles deb rpm appimage"
          - platform: windows-latest
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # tauri-action reads GITHUB_TOKEN from env (below), not git creds,
          # so keep the contents:write token out of .git/config for later steps.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "./src-tauri -> target"
          # x86/arm 러너 모두 runner.os가 "Linux"라 캐시 키가 겹칠 수 있다 → 러너 라벨로 분리.
          key: ${{ matrix.platform }}

      - name: Install Ubuntu system dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & release Tauri app
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Monaco 번들링이 기본 Node 힙(~2GB)을 넘겨 OOM → 힙 상향
          NODE_OPTIONS: --max-old-space-size=4096
          # 자동 업데이트 서명 — 이 키가 있으면 tauri-action이 각 설치본을 서명(.sig)하고
          # latest.json 업데이트 매니페스트를 생성해 릴리스에 업로드한다. 키/비번은 repo Secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: "Gitpervisor ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          releaseBody: "See the assets below to download and install."
          # 자동 공개: draft면 /releases/latest API가 404 → 웹사이트 다운로드 버튼이
          # 릴리스 목록 페이지로 폴백된다. 태그 푸시만으로 설치 파일이 링크되도록 공개.
          releaseDraft: false
          # 수동 실행(workflow_dispatch)은 리허설용이므로 prerelease로 표시한다.
          # /releases/latest API가 prerelease를 건너뛰어, 테스트 태그가 웹사이트
          # 다운로드 버튼이나 앱 자동 업데이트를 가로채지 않는다.
          # 태그 푸시(진짜 릴리스)는 false → 정식 공개.
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          args: ${{ matrix.args }}
